# Arma la app Android y el instalador de Windows (con el reconocedor de voz y
# la app Android adentro) y los publica en la pagina de Descargas del repo:
#   https://github.com/<usuario>/<repo>/releases/tag/descargas
# Los enlaces de descarga no cambian entre versiones.
name: Instaladores

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instaladores-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas (tipos y servidor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:server

  e2e:
    # informativa: no frena la publicacion (el audio de Chromium sin pantalla depende de la maquina)
    name: Prueba de punta a punta (compu + celulares)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  android:
    name: App Android
    runs-on: ubuntu-latest
    env:
      FIRMA_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Firma propia (solo si se cargaron los secretos)
        if: env.FIRMA_B64 != ''
        run: |
          echo "$FIRMA_B64" | base64 -d > "$RUNNER_TEMP/firma.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/firma.p12" >> "$GITHUB_ENV"
      - name: Armar el APK
        run: gradle -p android assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - run: cp android/app/build/outputs/apk/release/app-release.apk alabanza.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: alabanza.apk
          if-no-files-found: error

  windows:
    name: Instalador de Windows
    needs: android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconocedor de voz (guardado entre corridas)
        id: modelo
        uses: actions/cache@v4
        with:
          path: modelos
          key: modelo-voz-${{ hashFiles('src/server/modelos.ts') }}
      - name: Bajar el reconocedor de voz
        if: steps.modelo.outputs.cache-hit != 'true'
        # si falla la descarga, el instalador sale igual (la app ofrece bajarlo despues)
        continue-on-error: true
        run: npm run modelos
      - uses: actions/download-artifact@v4
        with:
          name: app-android
          path: extras
      - name: Armar el instalador
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/Multitrack-Alabanza-Instalador.exe
          if-no-files-found: error

  publicar:
    name: Publicar en Descargas
    needs: [pruebas, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: descargas
          merge-multiple: true
      - name: Subir a la página de Descargas
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cat > notas.md <<EOF
          **Versión del $(date -u +%d/%m/%Y)** · rama \`${GITHUB_REF_NAME}\` · commit ${GITHUB_SHA::7}

          - **Multitrack-Alabanza-Instalador.exe**: para la computadora (Windows). Incluye el reconocedor de voz y la app Android para ofrecerla a los celulares.
          - **alabanza.apk**: app para Android. También se baja desde la compu (en el celular: "Invitar" o "La próxima vez sin QR").

          Windows puede avisar que el instalador "no es común": tocá **Más información → Ejecutar de todas formas**.
          EOF
          if gh release view descargas --repo "$REPO" > /dev/null 2>&1; then
            gh release upload descargas descargas/Multitrack-Alabanza-Instalador.exe descargas/alabanza.apk --repo "$REPO" --clobber
            gh release edit descargas --repo "$REPO" --title "Descargas" --notes-file notas.md
          else
            gh release create descargas descargas/Multitrack-Alabanza-Instalador.exe descargas/alabanza.apk --repo "$REPO" --target "$GITHUB_SHA" --title "Descargas" --notes-file notas.md
          fi
