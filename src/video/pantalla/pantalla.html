<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>AirTracks Video · proyector</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        cursor: none;
      }
      video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
      video.activo {
        z-index: 2;
      }
      #prueba {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #101216;
        color: #fff;
        font: 600 48px/1.2 system-ui, 'Segoe UI', sans-serif;
        text-align: center;
      }
      #prueba[hidden] {
        display: none;
      }
      #prueba small {
        font-size: 24px;
        font-weight: 400;
        color: #9aa3b2;
      }
    </style>
  </head>
  <body>
    <video id="a" class="activo" muted preload="auto"></video>
    <video id="b" muted preload="auto"></video>
    <div id="prueba" hidden>
      AirTracks Video
      <small>Este es el proyector: acá se ve el video mientras suena la canción.</small>
    </div>
    <script src="pantalla.js"></script>
  </body>
</html>
